{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'learning/style.css' %}?v=2">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'learning:home' %}"><span class="brand-mark" aria-hidden="true">✳</span> Study Hub</a>
    <nav class="account-nav" aria-label="Account">
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="account-link" type="submit">Log out</button></form>
      {% else %}
        <a class="nav-login" href="{% url 'login' %}">Log in</a>
        <a class="nav-signup" href="{% url 'learning:signup' %}">Sign up <span aria-hidden="true">↗</span></a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><span>✳ &nbsp;Study Hub</span><span>Your space to learn, explore, and grow.</span></footer>
</body>
</html>
