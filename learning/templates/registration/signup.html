{% extends "learning/base.html" %}
{% block title %}Sign up | Study Hub{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Sign up</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
</div>
{% endblock %}
